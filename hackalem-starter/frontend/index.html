<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HackAlem AI — тестовый чат</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e39;
    --text: #e7e9ee;
    --muted: #8a8f9c;
    --accent: #5b8cff;
    --user-bubble: #2a3a63;
    --assistant-bubble: #1f232c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header h1 { font-size: 15px; margin: 0; }
  header span { font-size: 12px; color: var(--muted); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 10px;
    max-width: 80%;
    white-space: pre-wrap;
    line-height: 1.4;
    font-size: 14px;
  }
  .msg.user { align-self: flex-end; background: var(--user-bubble); }
  .msg.assistant { align-self: flex-start; background: var(--assistant-bubble); border: 1px solid var(--border); }
  .msg.system { align-self: center; color: var(--muted); font-size: 12px; }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
  }
  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>
    <h1>HackAlem AI — стартовый каркас</h1>
    <span>тестовый чат для проверки агента</span>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Напиши что-нибудь агенту..." autocomplete="off" />
    <button id="send" type="submit">Отправить</button>
  </form>

  <script>
    // Простая заглушка "session_id" — чтобы каждая вкладка/пользователь имел
    // свою историю переписки. Для хакатона этого достаточно.
    const sessionId = localStorage.getItem("session_id") || crypto.randomUUID();
    localStorage.setItem("session_id", sessionId);

    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function loadHistory() {
      try {
        const res = await fetch(`/api/history/${sessionId}`);
        const history = await res.json();
        history.forEach((m) => addMessage(m.role, m.content));
      } catch (e) {
        addMessage("system", "Не удалось загрузить историю: " + e.message);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage("user", text);
      input.value = "";
      sendBtn.disabled = true;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`${res.status}: ${errText}`);
        }
        const data = await res.json();
        addMessage("assistant", data.reply);
      } catch (err) {
        addMessage("system", "Ошибка: " + err.message);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    loadHistory();
  </script>
</body>
</html>
